; PlatformIO Project Configuration for CANBUS-Stepper v2.1
; ESP32-S3-MINI-1-N4R2 (4MB Flash, 2MB Quad PSRAM, Native USB OTG)

[platformio]
default_envs = standalone_can
src_dir = src
include_dir = include

[env]
platform = espressif32 @ ^6.6.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.flash_size = 4MB
board_build.partitions = default.csv

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=3
    -I include

lib_deps =
    teemuatlut/TMCStepper @ ^0.7.3
    Wire
    bblanchon/ArduinoJson @ ^7.0.4

; -------------------------------------------------------------
; Environment 1: Standalone Closed-Loop Smart CAN Actuator
; -------------------------------------------------------------
[env:standalone_can]
build_flags =
    ${env.build_flags}
    -D MODE_STANDALONE_CAN=1

; -------------------------------------------------------------
; Environment 2: Hardware Bring-Up & Diagnostics Mode
; -------------------------------------------------------------
[env:diagnostics]
build_flags =
    ${env.build_flags}
    -D MODE_DIAGNOSTICS=1

; -------------------------------------------------------------
; Environment 3: Micro-ROS / ROS 2 Actuator Node
; -------------------------------------------------------------
[env:microros]
build_flags =
    ${env.build_flags}
    -D MODE_MICROROS=1
