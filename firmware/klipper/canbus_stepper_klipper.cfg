# =========================================================================
# CANBUS-Stepper v2.1 Klipper Configuration Template
# ESP32-S3 + TMC2209 + AS5600 + CAN Bus (TCAN1051V)
# =========================================================================

[mcu can_stepper]
canbus_uuid: <YOUR_CANBUS_UUID>
# Run `~/klippy-env/bin/python ~/klipper/scripts/canbus_query.py can0` to find UUID

# -------------------------------------------------------------------------
# Motor Configuration (Example: Extruder / Toolhead / Actuator Axis)
# -------------------------------------------------------------------------
[extruder]
step_pin: can_stepper:gpio5
dir_pin: !can_stepper:gpio6
enable_pin: !can_stepper:gpio21
microsteps: 16
rotation_distance: 22.68
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA0 # (Configure if using external hotend board or toolhead expansion)
sensor_type: EPCOS 100K B57560G104F
sensor_pin: can_stepper:gpio7 # On-board / Extruder NTC thermistor input
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 300

# -------------------------------------------------------------------------
# Trinamic TMC2209 UART Configuration
# -------------------------------------------------------------------------
[tmc2209 extruder]
uart_pin: can_stepper:gpio17
tx_pin: can_stepper:gpio18
uart_address: 0
run_current: 0.700
stealthchop_threshold: 999999
interpolate: true
sense_resistor: 0.110
diag_pin: ^can_stepper:gpio16 # TMC DIAG pin (StallGuard4)
driver_SGTHRS: 100

# -------------------------------------------------------------------------
# Board Temperature & Voltage Monitoring
# -------------------------------------------------------------------------
[temperature_sensor can_stepper_temp]
sensor_type: Generic 3950
sensor_pin: can_stepper:gpio7
min_temp: -10
max_temp: 110

# -------------------------------------------------------------------------
# Auxiliary Endstops / Bed Probe Inputs
# -------------------------------------------------------------------------
[probe]
pin: ^can_stepper:gpio14 # AUX1 Port
x_offset: 0.0
y_offset: 25.0
z_offset: 0.0
speed: 5.0

# [filament_switch_sensor runout]
# switch_pin: ^can_stepper:gpio13 # AUX2 Port
# pause_on_runout: True

# -------------------------------------------------------------------------
# Status LEDs
# -------------------------------------------------------------------------
[output_pin status_led]
pin: can_stepper:gpio10
value: 1
shutdown_value: 0
